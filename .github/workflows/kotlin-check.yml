name: Kotlin check (fast)

# Compiler-only feedback loop for the agent: no APK, no NDK, no native build.
# Kotlinc runs in a couple of minutes instead of the ~6 min full APK build, and
# the errors are written to the run summary so they can be read straight from
# the API without downloading a log archive.
#
# Native code is skipped on purpose: this reports Kotlin/Compose/resource
# errors only. Use apk-32bit-fast.yml when a real APK is needed.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/kotlin-check.yml"

permissions:
  contents: read

concurrency:
  group: kotlin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      # Compiles Kotlin against the Android SDK jars. AGP needs an SDK, but no
      # NDK: the native block in app/build.gradle.kts is skipped when it is
      # absent, which is exactly the fast path we want here.
      - name: Compile Kotlin (debug, no native)
        run: |
          set +e
          ./gradlew :app:compileDebugKotlin \
            -PharnessAbis=armeabi-v7a \
            --no-daemon --console=plain \
            > build.log 2>&1
          STATUS=$?
          echo "exit=$STATUS"

          # Keep only the compiler diagnostics: they are the whole point.
          grep -E "^(e|w): |^ERROR|Execution failed|What went wrong|^> " build.log \
            > diagnostics.txt || true
          if [ -s diagnostics.txt ]; then
            head -n 200 diagnostics.txt
          else
            echo "no diagnostics captured" > diagnostics.txt
          fi

          # Errors grouped by file, so the agent sees at a glance which files broke.
          { echo "### Kotlin errors by file"; echo
            grep -E "^e: file://" diagnostics.txt \
              | sed -E 's|^e: file://[^/]*/[^/]*/[^/]*/[^/]*/[^/]*/([^:]+):([0-9]+):[0-9]+ (.*)$|`\1:\2` — \3|' \
              | sort | uniq -c | sort -rn | head -n 80 || true
            echo
            echo "### Raw diagnostics"; echo '```'
            head -n 120 diagnostics.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      # Unit tests are pure JVM, so they run without the Android emulator. Their
      # failures are usually real logic bugs, not environment noise.
      - name: Unit tests
        if: success()
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest \
            -PharnessAbis=armeabi-v7a \
            --no-daemon --console=plain \
            > tests.log 2>&1
          STATUS=$?
          { echo "### Unit tests"; echo '```'
            grep -E "FAILED|tests completed|What went wrong|expected|actual" tests.log | head -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      # The log survives a failure so the full text is one download away when
      # the summary is not enough.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-check-${{ github.sha }}
          path: |
            build.log
            diagnostics.txt
            tests.log
          retention-days: 3
          if-no-files-found: ignore
