name: Kotlin check (fast)

# Compiler-only feedback loop: no APK, no NDK, no native build. Kotlinc runs in
# a couple of minutes instead of the ~6 min full APK build, and the diagnostics
# are written to the run summary.
#
# MANUAL ONLY: this workflow has no push and no pull_request trigger, so it never
# runs on its own. Nothing starts when a branch is pushed or a pull request is
# opened; it runs only when someone dispatches it by hand from the Actions tab.
# Use apk-32bit-fast.yml for real builds.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "O que verificar"
        type: choice
        default: kotlin
        options:
          - kotlin          # só compila (o mais rápido)
          - kotlin+tests    # compila e roda os testes unitários JVM
          - resources       # só o empacotamento de recursos (strings, XML)
          - all             # compila + recursos + testes
      filter:
        description: "Filtro de teste, ex.: *EdgeTts* (só com testes)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: kotlin-check-${{ github.ref }}-${{ github.event.inputs.scope || 'kotlin' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # setup-gradle manages ~/.gradle/caches with a rolling key that saves every
      # run. The cache below only keeps the Kotlin incremental output, which
      # Gradle does not manage. The key includes the commit sha on purpose: with
      # a fixed key the first save wins and later runs report "Cache hit occurred
      # on the primary key, not saving cache", leaving stale output behind.
      - name: Cache Kotlin incremental output
        uses: actions/cache@v4
        with:
          path: |
            ~/.kotlin
            app/build/kotlin
            app/build/classes
            app/build/tmp/kotlin-classes
          key: kotlin-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            kotlin-${{ runner.os }}-${{ github.ref_name }}-
            kotlin-${{ runner.os }}-

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Kotlin
        id: compile
        run: |
          set +e
          ./gradlew :app:compileDebugKotlin \
            -PharnessAbis=armeabi-v7a \
            --no-daemon --console=plain --build-cache --parallel \
            > build.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "exit=$STATUS"

          grep -E "^(e|w): |^ERROR|Execution failed|What went wrong|^> " build.log \
            > diagnostics.txt || true

          WARNINGS=$(grep -cE "^w: " diagnostics.txt || true)
          ERRORS=$(grep -cE "^e: " diagnostics.txt || true)
          echo "errors=$ERRORS" >> "$GITHUB_OUTPUT"

          { echo "### Kotlin errors by file"; echo
            if [ "$ERRORS" = "0" ]; then
              echo "No compilation errors."
            else
              grep -E "^e: file://" diagnostics.txt \
                | sed -E 's|^e: file://[^/]*/[^/]*/[^/]*/[^/]*/[^/]*/([^:]+):([0-9]+):[0-9]+ (.*)$|`\1:\2` — \3|' \
                | sort | uniq -c | sort -rn | head -n 80
            fi
            echo
            echo "**${ERRORS} error(s), ${WARNINGS} warning(s)**"
            echo
            echo "<details><summary>Raw diagnostics</summary>"; echo; echo '```'
            head -n 150 diagnostics.txt || true
            echo '```'; echo; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      # Resources only: catches duplicate strings, bad XML and missing
      # translations without invoking Kotlin at all.
      - name: Package resources
        if: |
          always() && (github.event.inputs.scope == 'resources' || github.event.inputs.scope == 'all')
        run: |
          set +e
          ./gradlew :app:mergeDebugResources :app:processDebugResources \
            -PharnessAbis=armeabi-v7a \
            --no-daemon --console=plain \
            > resources.log 2>&1
          STATUS=$?
          { echo "### Resources"; echo '```'
            grep -E "error:|Error:|Execution failed|What went wrong|more than one time|Duplicate" resources.log \
              | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Unit tests
        if: |
          always() && steps.compile.outputs.status == '0' &&
          (github.event.inputs.scope == 'kotlin+tests' || github.event.inputs.scope == 'all')
        run: |
          set +e
          FILTER="${{ github.event.inputs.filter }}"
          ARGS=""
          if [ -n "$FILTER" ]; then ARGS="--tests $FILTER"; fi
          # shellcheck disable=SC2086
          ./gradlew :app:testDebugUnitTest $ARGS \
            -PharnessAbis=armeabi-v7a \
            --no-daemon --console=plain \
            > tests.log 2>&1
          STATUS=$?
          PASSED=$(grep -oE "[0-9]+ tests completed" tests.log | tail -1 || true)
          FAILING=$(grep -E "^[A-Za-z0-9_.]+ > .* FAILED" tests.log | head -n 20 || true)
          { echo "### Unit tests"; echo
            echo "Filter: \`${FILTER:-all}\` — ${PASSED:-no summary}"
            echo
            if [ -n "$FAILING" ]; then
              echo "**Failing tests**"; echo '```'; echo "$FAILING"; echo '```'; echo
            fi
            echo '```'
            grep -E "FAILED|tests completed|What went wrong|expected|actual|Exception|AssertionError" tests.log \
              | head -n 80 || true
            echo '```'
            if [ "$STATUS" != "0" ]; then
              echo
              echo "<details><summary>Tail of the test log</summary>"; echo
              echo '```'
              tail -n 60 tests.log || true
              echo '```'; echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-check-${{ github.sha }}
          path: |
            build.log
            diagnostics.txt
            tests.log
            resources.log
          retention-days: 3
          if-no-files-found: ignore
