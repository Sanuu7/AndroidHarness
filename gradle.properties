# CodeQL autobuilds every variant (debug + release), so two Kotlin compiles run
# at once under instrumentation and 4g dies with "GC overhead limit exceeded".
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
